<text x="212" y="64" font-size="15" fill="#c3c2b7">evidence-layer skill for LLM agents</text>
<text x="52" y="96" font-size="15" fill="#c3c2b7">retrieve first · write second · self-audit last — every citation survives the follow-up question</text>
