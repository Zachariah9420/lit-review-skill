<text x="806" y="345" font-size="12.5" fill="#c3c2b7">[abstract] [full text p.X] [?]</text>
<circle cx="793" cy="364" r="3" fill="#c98500"/>
<text x="806" y="368" font-size="13" fill="#ffffff">66-case regression suite</text>
