<text x="806" y="247" font-size="12.5" fill="#c3c2b7">evidence · role · injection</text>
<circle cx="793" cy="266" r="3" fill="#c98500"/>
<text x="806" y="270" font-size="13" fill="#ffffff">dual-path identity gate</text>
<circle cx="793" cy="291" r="3" fill="#c98500"/>
